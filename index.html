<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure View</title>
    <style>
        body {
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .container { text-align: center; }
        img { max-width: 90vw; max-height: 80vh; border-radius: 4px; }
        #expired { display: none; font-size: 24px; color: #ff4d4d; }
    </style>
</head>
<body>
    <div class="container" id="view-box">
        <img src="image.jpg" alt="Photo" id="target-img">
        <p style="margin-top: 15px; color: #888; font-size: 14px;">Closing in <span id="countdown">3</span>s...</p>
    </div>
    <div id="expired">
        <h2>Access Denied</h2>
        <p id="error-msg">This link has expired or reached its view limit.</p>
    </div>

    <script>
        // 检查本地浏览次数
        let viewCount = localStorage.getItem('photo_view_count') || 0;
        viewCount = parseInt(viewCount);

        const viewBox = document.getElementById('view-box');
        const expiredEl = document.getElementById('expired');
        const errorMsg = document.getElementById('error-msg');

        if (viewCount >= 3) {
            // 如果超过3次，直接显示失效，不加载照片
            viewBox.style.display = 'none';
            expiredEl.style.display = 'block';
            errorMsg.textContent = "You have reached the maximum view limit (3 times).";
        } else {
            // 没超过3次，次数加1，并开始3秒倒计时
            localStorage.setItem('photo_view_count', viewCount + 1);
            
            let timeLeft = 3;
            const countdownEl = document.getElementById('countdown');

            const timer = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    viewBox.style.display = 'none';
                    expiredEl.style.display = 'block';
                    try { window.close(); } catch (e) {}
                }
            }, 1000);
        }
    </script>
</body>
</html>
