<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure View</title>
    <style>
        body {
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .container { text-align: center; }
        img { max-width: 90vw; max-height: 80vh; border-radius: 4px; }
        #expired { display: none; font-size: 24px; color: #ff4d4d; text-align: center; }
        #haha-box { display: none; font-size: 28px; color: #ffeb3b; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div class="container" id="view-box">
        <img src="image.jpg" alt="Photo" id="target-img">
        <p style="margin-top: 15px; color: #888; font-size: 14px;">Closing in <span id="countdown">2</span>s...</p>
    </div>

    <div id="haha-box">
        <h4>为了防止颜光心乱乱传播照片，达到限制了颜光心！哈哈哈哈哈哈哈哈哈哈哈🤣🤣🤣🤣👍👍👍🤣🤣✨</h4>
    </div>

    <div id="expired">
        <h2>Access Denied</h2>
        <p id="error-msg" style="font-size: 14px; color: #888;">Closing in <span id="deny-countdown">5</span>s...</p>
    </div>

    <script>
        // 获取当前的浏览次数
        let viewCount = localStorage.getItem('photo_view_count');
        viewCount = viewCount ? parseInt(viewCount) : 0;
        console.log("Current view count before increment:", viewCount);

        const viewBox = document.getElementById('view-box');
        const hahaBox = document.getElementById('haha-box');
        const expiredEl = document.getElementById('expired');
        const errorMsg = document.getElementById('error-msg');
        const countdownEl = document.getElementById('countdown');

        if (viewCount >= 2) {
            // 次数已经达到或超过 2 次（即第 3 次及之后）
            // 确保绝对不显示照片容器
            viewBox.style.display = 'none';
            // 显示限制提示
            hahaBox.style.display = 'block';

            // 1 秒后切换到 Access Denied 并倒计时 5 秒
            setTimeout(() => {
                hahaBox.style.display = 'none';
                expiredEl.style.display = 'block';
                errorMsg.innerHTML = 'This link has expired or reached its view limit.<br>Closing in <span id="deny-countdown">5</span>s...';

                let denyTime = 5;
                const denyTimer = setInterval(() => {
                    denyTime--;
                    const currentDenyEl = document.getElementById('deny-countdown');
                    if (currentDenyEl) currentDenyEl.textContent = denyTime;
                    if (denyTime <= 0) {
                        clearInterval(denyTimer);
                        try { window.close(); } catch (e) {}
                    }
                }, 1000);
            }, 1000);

        } else {
            // 还没到限制（第 1 次或第 2 次）：次数加 1，保存并正常显示照片 2 秒
            viewCount += 1;
            localStorage.setItem('photo_view_count', viewCount);
            console.log("Updated view count:", viewCount);
            
            let timeLeft = 2;
            const timer = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    viewBox.style.display = 'none';
                    try { window.close(); } catch (e) {}
                }
            }, 1000);
        }
    </script>
</body>
</html>
