<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure View</title>
    <style>
        body {
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .container { text-align: center; }
        img { max-width: 90vw; max-height: 80vh; border-radius: 4px; }
        #expired { display: none; font-size: 24px; color: #ff4d4d; text-align: center; }
        #haha-box { display: none; font-size: 36px; color: #ffeb3b; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div class="container" id="view-box">
        <img src="image.jpg" alt="Photo" id="target-img">
        <p style="margin-top: 15px; color: #888; font-size: 14px;">Closing in <span id="countdown">2</span>s...</p>
    </div>

    <div id="haha-box">
        <h2>哈哈</h2>
    </div>

    <div id="expired">
        <h2>Access Denied</h2>
        <p id="error-msg" style="font-size: 14px; color: #888;">Closing in <span id="deny-countdown">5</span>s...</p>
    </div>

    <script>
        // 检查本地浏览次数
        let viewCount = localStorage.getItem('photo_view_count') || 0;
        viewCount = parseInt(viewCount);

        const viewBox = document.getElementById('view-box');
        const hahaBox = document.getElementById('haha-box');
        const expiredEl = document.getElementById('expired');
        const errorMsg = document.getElementById('error-msg');
        const countdownEl = document.getElementById('countdown');
        const denyCountdownEl = document.getElementById('deny-countdown');

        if (viewCount >= 2) {
            // 超过 2 次：先照常显示照片，开始 2 秒倒计时
            localStorage.setItem('photo_view_count', viewCount + 1);
            let timeLeft = 2;
            countdownEl.textContent = timeLeft;

            const timer = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft;

                if (timeLeft === 1) {
                    // 倒计时还剩 1 秒时，突然切换到“哈哈”
                    viewBox.style.display = 'none';
                    hahaBox.style.display = 'block';
                }

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    // “哈哈”显示 1 秒后，切换到 Access Denied 并倒计时 5 秒
                    setTimeout(() => {
                        hahaBox.style.display = 'none';
                        expiredEl.style.display = 'block';
                        errorMsg.innerHTML = 'This link has expired or reached its view limit.<br>Closing in <span id="deny-countdown">5</span>s...';

                        let denyTime = 5;
                        const denyTimer = setInterval(() => {
                            denyTime--;
                            const currentDenyEl = document.getElementById('deny-countdown');
                            if (currentDenyEl) currentDenyEl.textContent = denyTime;
                            if (denyTime <= 0) {
                                clearInterval(denyTimer);
                                try { window.close(); } catch (e) {}
                            }
                        }, 1000);
                    }, 1000);
                }
            }, 1000);

        } else {
            // 没超过 2 次，次数加 1，正常 2 秒倒计时关闭
            localStorage.setItem('photo_view_count', viewCount + 1);
            
            let timeLeft = 2;
            const timer = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    viewBox.style.display = 'none';
                    try { window.close(); } catch (e) {}
                }
            }, 1000);
        }
    </script>
</body>
</html>
